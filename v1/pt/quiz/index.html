.pv-chip { display: inline-flex; align-items: center; gap: .4em; padding: .5em .85em; border-radius: 2em; background: color-mix(in srgb, var(--c1) 11%, white); color: var(--c3); font-size: .78em; font-weight: 700; }
.pv-chip svg { width: 1em; height: 1em; color: var(--c1); }
.pv-chip.is-empty { width: 7.5em; height: 2.2em; background: #F0EEF6; }
.pv-svc { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .8em; }
.pv-svc > div { display: grid; gap: .5em; align-content: start; padding: .95em; border-radius: .8em; border: 1px solid #ECEAF3; background: #FBFBFD; min-width: 0; }
.pv-ico { width: 1.7em; height: 1.7em; border-radius: .5em; background: color-mix(in srgb, var(--c1) 16%, white); }
.pv-svc b { font-size: .9em; color: var(--c3); line-height: 1.2; overflow-wrap: anywhere; }
.pv-svc .sk { width: 80%; height: .4em; }
.pv-svc .sk--t { width: 64%; height: .62em; background: #DCD8EA; }
.pv-more { font: 500 .74em/1 var(--f-mono); letter-spacing: .06em; color: var(--c1); }
.pv-foot { display: flex; align-items: center; justify-content: space-between; gap: 1em; padding-top: 1em; border-top: 1px solid #ECEAF3; font-size: .8em; color: #5A5470; }
.pv-serving.is-empty { width: 11em; height: .6em; border-radius: 1em; background: #E6E4EE; }
.pv-ways { display: flex; gap: .45em; }
.pv-ways span { display: grid; place-items: center; width: 2.2em; height: 2.2em; border-radius: 50%; background: color-mix(in srgb, var(--c1) 12%, white); color: var(--c1); }
.pv-ways span.is-empty { background: #F0EEF6; }
.pv-ways svg { width: 1.15em; height: 1.15em; }
.toast { position: absolute; display: flex; align-items: center; gap: 12px; padding: 12px 16px 12px 14px; border-radius: 14px; background: var(--white); color: var(--indigo); box-shadow: 0 24px 60px -18px rgba(0, 0, 0, .55); font-size: 13px; line-height: 1.3; }
.toast__dot { position: relative; width: 10px; height: 10px; border-radius: 50%; background: var(--success); flex: none; }
.toast__dot::after { content: ""; position: absolute; inset: -5px; border-radius: 50%; border: 2px solid var(--success); opacity: .35; animation: ping 1.8s var(--ease) infinite; }
.toast b { display: block; font-size: 13px; }
.toast small { color: var(--graphite); font-size: 12px; }
.qz-toast { left: -5%; bottom: -20px; max-width: 86%; opacity: 0; translate: 0 14px; transition: opacity .45s var(--ease), translate .7s var(--ease-x); pointer-events: none; }
.qz-toast.is-on { opacity: 1; translate: 0 0; }

/* ---------- screens ---------- */
.qz-screen { display: grid; }
.qz-screen.is-out { opacity: 0; transform: translateY(-14px); transition: opacity .22s var(--ease), transform .3s var(--ease); }
.qz-head { display: flex; align-items: center; gap: 16px; min-height: 44px; margin-bottom: clamp(14px, 2.4vh, 24px); }
.qz-back { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 12px 0 0; color: var(--haze); font-weight: 500; font-size: 15px; transition: color .3s; }
.qz-back svg { width: 16px; height: 16px; transform: rotate(180deg); transition: transform .45s var(--ease-x); }
.qz-back:hover { color: var(--white); }
.qz-back:hover svg { transform: rotate(180deg) translateX(3px); }
.qz-head .qz-back + .eyebrow { padding-left: 16px; border-left: 1px solid rgba(255, 255, 255, .16); }
.qz-title { font-family: var(--f-display); font-weight: 500; font-size: clamp(34px, 3.3vw, 54px); line-height: 1.02; letter-spacing: -.035em; text-wrap: balance; outline: none; }
.qz-title .ln { display: block; }
.qz-intro .qz-title { font-size: clamp(40px, 4.3vw, 74px); line-height: .96; letter-spacing: -.045em; }
.qz-help { margin-top: 16px; color: var(--haze); font-size: clamp(16px, 1.2vw, 18px); line-height: 1.55; max-width: 48ch; text-wrap: pretty; }
.qz-intro .qz-help { font-size: clamp(17px, 1.35vw, 20px); max-width: 44ch; }
.qz-body { display: grid; gap: clamp(24px, 3.4vh, 34px); margin-top: clamp(26px, 4vh, 40px); }
.qz-q { border: 0; margin: 0; padding: 0; min-width: 0; }
.qz-legend { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; width: 100%; padding: 0; margin-bottom: 12px; font-size: 16px; font-weight: 500; color: var(--white); }
.qz-legend small, .qz-note { font: 500 10.5px/1.4 var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--lavender); white-space: nowrap; }
.qz-note { display: block; margin: -4px 0 12px; }
.qz-opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.qz-opts--3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.qz-opt { position: relative; display: flex; align-items: center; gap: 12px; min-height: 58px; padding: 13px 14px; border-radius: 14px; border: 1px solid rgba(140, 130, 184, .3); background: rgba(255, 255, 255, .025); cursor: pointer; transition: border-color .25s var(--ease), background-color .25s var(--ease), transform .5s var(--ease-x); }
.qz-opt input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
.qz-opt:hover { border-color: var(--lavender); background: rgba(255, 255, 255, .05); }
.qz-opt:active { transform: scale(.985); }
.qz-opt:has(input:focus-visible) { outline: 2px solid var(--yellow); outline-offset: 3px; }
.qz-opt:has(input:checked) { border-color: var(--yellow); background: rgba(255, 224, 0, .075); }
.qz-key { display: grid; place-items: center; flex: none; width: 26px; height: 26px; border-radius: 7px; border: 1px solid rgba(255, 255, 255, .2); font: 500 11px/1 var(--f-mono); color: var(--haze); transition: background-color .25s, color .25s, border-color .25s; }
.qz-opt:has(input:checked) .qz-key { background: var(--yellow); border-color: var(--yellow); color: var(--indigo); }
.qz-opt__ico { width: 22px; height: 22px; flex: none; color: var(--lavender); transition: color .25s; }
.qz-opt:has(input:checked) .qz-opt__ico { color: var(--yellow); }
.qz-opt__label { flex: 1; min-width: 0; font-size: 16px; line-height: 1.3; color: var(--white); }
.qz-tick { display: grid; place-items: center; flex: none; width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid rgba(255, 255, 255, .22); transition: background-color .25s, border-color .25s; }
.qz-opt--multi .qz-tick { border-radius: 6px; }
.qz-tick svg { width: 12px; height: 12px; color: var(--indigo); opacity: 0; transform: scale(.4); transition: opacity .2s, transform .45s var(--ease-x); }
.qz-opt:has(input:checked) .qz-tick { background: var(--yellow); border-color: var(--yellow); }
.qz-opt:has(input:checked) .qz-tick svg { opacity: 1; transform: none; }
.qz-chips { display: flex; flex-wrap: wrap; gap: 8px; }
.qz-chip { position: relative; display: inline-flex; align-items: center; gap: 8px; min-height: 46px; padding: 0 16px 0 12px; border-radius: 99px; border: 1px solid rgba(140, 130, 184, .3); background: rgba(255, 255, 255, .025); cursor: pointer; font-size: 15px; transition: border-color .25s, background-color .25s, transform .5s var(--ease-x); }
.qz-chip input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
.qz-chip:hover { border-color: var(--lavender); }
.qz-chip:active { transform: scale(.97); }
.qz-chip:has(input:focus-visible) { outline: 2px solid var(--yellow); outline-offset: 3px; }
.qz-chip:has(input:checked) { border-color: var(--yellow); background: rgba(255, 224, 0, .075); }
.qz-chip .qz-key { width: 22px; height: 22px; border-radius: 6px; font-size: 10px; }
.qz-chip__ico { position: relative; width: 16px; height: 16px; flex: none; color: var(--lavender); }
.qz-chip__ico::before, .qz-chip__ico::after { content: ""; position: absolute; left: 50%; top: 50%; width: 11px; height: 1.5px; margin: -.75px 0 0 -5.5px; background: currentColor; transition: transform .45s var(--ease-x); }
.qz-chip__ico::after { transform: rotate(90deg); }
.qz-chip:has(input:checked) .qz-chip__ico { color: var(--yellow); }
.qz-chip:has(input:checked) .qz-chip__ico::before { transform: translate(-2.5px, 2px) rotate(45deg) scaleX(.5); }
.qz-chip:has(input:checked) .qz-chip__ico::after { transform: translate(1.5px, 0) rotate(-45deg) scaleX(.95); }
.qz-add { display: flex; gap: 8px; margin-top: 14px; }
.qz-add input { flex: 1; min-width: 0; min-height: 48px; padding: 0 18px; border-radius: 99px; border: 1px solid rgba(140, 130, 184, .3); background: rgba(255, 255, 255, .04); color: var(--white); font: 400 16px var(--f-body); outline: none; transition: border-color .25s; }
.qz-add input:focus { border-color: var(--yellow); }
.qz-add input::placeholder { color: rgba(201, 195, 227, .5); }
.qz-other { margin-top: 14px; }
.qz-field { display: grid; gap: 6px; }
.qz-field label { font-size: 15px; font-weight: 500; color: var(--haze); }
.qz-input { width: 100%; min-height: 56px; padding: 10px 2px 12px; border: 0; border-bottom: 1.5px solid rgba(201, 195, 227, .3); border-radius: 0; background: transparent; color: var(--white); font: 500 clamp(22px, 2.1vw, 28px)/1.25 var(--f-display); letter-spacing: -.015em; outline: none; appearance: none; transition: border-color .25s var(--ease); }
.qz-input:focus { border-color: var(--yellow); }
.qz-input::placeholder { color: rgba(140, 130, 184, .36); }
textarea.qz-input { min-height: 104px; resize: vertical; font: 400 17px/1.5 var(--f-body); letter-spacing: 0; padding-top: 12px; }
.qz-field.is-invalid .qz-input, .qz-add.is-invalid input { border-color: #FF7A8E; }
.qz-err { margin-top: 10px; font-size: 14px; color: #FF97A6; }
.qz-err:empty { display: none; }
.qz-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 18px; margin-top: clamp(30px, 4.4vh, 46px); }
.qz-hint { display: inline-flex; align-items: center; gap: 8px; font: 500 10.5px/1 var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--lavender); }
.qz-hint kbd { display: inline-grid; place-items: center; min-width: 26px; height: 22px; padding: 0 6px; border-radius: 6px; border: 1px solid rgba(255, 255, 255, .2); font: inherit; color: var(--haze); }
.qz-skip { min-height: 44px; padding: 0 6px; color: var(--haze); font-size: 15px; text-decoration: underline; text-underline-offset: 4px; text-decoration-color: rgba(201, 195, 227, .35); }
.qz-skip:hover { color: var(--white); }
@media (hover: none) { .qz-hint, .qz-key { display: none !important; } }

/* intro */
.qz-points { display: grid; gap: 12px; margin-top: clamp(30px, 5vh, 52px); padding-top: 26px; border-top: 1px solid rgba(140, 130, 184, .2); }
.qz-points li { display: flex; gap: 12px; align-items: flex-start; color: var(--haze); font-size: 16px; }
.qz-points svg { width: 18px; height: 18px; color: var(--yellow); flex: none; margin-top: 3px; }
.qz-mprice { display: none; margin-top: 18px; color: var(--haze); }

/* review */
.qz-answers { margin-top: clamp(26px, 4vh, 38px); }
.qz-answers > p { margin-bottom: 12px; color: var(--lavender); }
.qz-group { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 16px; padding: 14px 0; border-top: 1px solid rgba(140, 130, 184, .2); }
.qz-group:last-child { border-bottom: 1px solid rgba(140, 130, 184, .2); }
.qz-group dl { display: grid; grid-template-columns: minmax(0, 132px) minmax(0, 1fr); gap: 6px 16px; margin: 0; font-size: 15px; }
.qz-group dt { color: var(--lavender); }
.qz-group dd { margin: 0; color: var(--white); overflow-wrap: anywhere; }
.qz-edit { align-self: start; min-height: 32px; padding: 4px 0; color: var(--yellow); font-weight: 700; font-size: 14px; }
.qz-edit:hover { text-decoration: underline; text-underline-offset: 4px; }
.qz-offer { display: grid; gap: 18px; margin-top: 28px; padding: clamp(22px, 3vw, 34px); border-radius: 22px; border: 1px solid rgba(140, 130, 184, .3); background: linear-gradient(160deg, #170750, var(--indigo) 60%); }
.qz-price { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 6px 16px; }
.qz-price__amt { display: flex; align-items: flex-start; font-family: var(--f-display); font-weight: 300; font-size: clamp(64px, 6vw, 88px); line-height: .82; letter-spacing: -.06em; color: var(--yellow); }
.qz-price__amt sup { font-size: .38em; line-height: 1; margin: .12em .06em 0 0; letter-spacing: 0; }
.qz-price .mono { color: var(--lavender); padding-bottom: .4em; }
.qz-inc { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 18px; padding-top: 16px; border-top: 1px solid var(--violet); }
.qz-inc li { display: flex; gap: 9px; font-size: 14px; line-height: 1.4; color: var(--haze); }
.qz-inc svg { width: 16px; height: 16px; color: var(--yellow); flex: none; margin-top: 2px; }
.qz-micro { text-align: center; font-size: 13px; color: var(--lavender); }
.qz-offer .qz-err { margin-top: 0; padding: 12px 14px; border-radius: 10px; background: rgba(196, 33, 58, .16); }
.btn--block { width: 100%; }
.btn[disabled] { opacity: .7; cursor: progress; }

/* done */
.qz-done__ico { display: grid; place-items: center; width: 64px; height: 64px; margin-bottom: 26px; border-radius: 50%; background: var(--yellow); color: var(--indigo); }
.qz-done__ico svg { width: 28px; height: 28px; }

/* motion: words rise through masks, the rest follows (CSS only) */
.qz-screen.is-in .w__i { animation: qzWord .95s var(--ease-x) both; animation-delay: calc(var(--i, 0) * 42ms); }
.qz-screen.is-in [data-in] { animation: qzUp .75s var(--ease-x) both; animation-delay: calc(140ms + var(--d, 0) * 38ms); }
@keyframes qzWord { from { transform: translateY(112%) rotate(3deg); } }
@keyframes qzUp { from { opacity: 0; transform: translateY(14px); } }
@keyframes ping { 0% { transform: scale(.6); opacity: .5; } 100% { transform: scale(1.6); opacity: 0; } }
@keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }

/* ---------- responsive ---------- */
@media (max-width: 1023px) {
  .qz { grid-template-columns: 1fr; min-height: 0; }
  .qz__preview { position: relative; top: 0; height: auto; min-height: 0; order: -1; display: block; padding: 16px var(--g) 0; background: none; overflow: visible; }
  .qz__mark, .qz-prev__head, .qz-prev__note, .qz-toast { display: none; }
  .qz-mockwrap { width: min(100%, 560px); margin-inline: auto; }
  .qz-mock { transform: none; max-height: 132px; overflow: hidden; border-radius: 12px; -webkit-mask-image: linear-gradient(180deg, #000 62%, transparent); mask-image: linear-gradient(180deg, #000 62%, transparent); }
  .qz__panel { align-content: start; padding: 22px var(--g) 64px; }
  .qz:has(.qz-input:focus, .qz-add input:focus) .qz__preview { display: none; }
  .qz-mprice { display: block; }
}
@media (max-width: 560px) {
  .qz-opts, .qz-opts--3 { grid-template-columns: 1fr; }
  .qz-opt { min-height: 54px; }
  .qz-actions .btn--primary { flex: 1 1 100%; }
  .qz-inc { grid-template-columns: 1fr; }
  .qz-group dl { grid-template-columns: 1fr; gap: 2px; }
  .qz-group dd + dt { margin-top: 8px; }
}
/* mobile toast: a calm pill at the bottom */
.qz-mtoast { position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom)); z-index: 70; display: none; align-items: center; gap: 10px; max-width: calc(100% - 32px); padding: 11px 16px; border-radius: 99px; background: var(--white); color: var(--indigo); font-size: 13px; font-weight: 700; box-shadow: 0 20px 50px -14px rgba(0, 0, 0, .7); transform: translate(-50%, calc(100% + 60px)); transition: transform .6s var(--ease-x); pointer-events: none; }
.qz-mtoast .toast__dot { width: 8px; height: 8px; }
.qz-mtoast.is-on { transform: translate(-50%, 0); }
@media (max-width: 1023px) { .qz-mtoast { display: flex; } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; scroll-behavior: auto !important; }
  .qz-mock { transform: none; }
}
</style>

    var q = target.closest('[data-q]'); if (q && q.classList.contains('is-invalid')) { q.classList.remove('is-invalid'); var er = $('.qz-err', q); if (er) er.textContent = ''; }
    if (target.name === 'trade') {
      var other = $('[data-other]', form);
      if (other) { other.hidden = st.trade !== 'other'; if (!other.hidden) { setTimeout(function () { $('#f-trade_other', form).focus(); }, 60); return; } }
    }
    // single-choice step (or the last of two single choices) → advance on its own
    var step = STEPS[screen - 1];
    if (!step || target.type !== 'radio') return;
    var allSingle = step.q.every(function (x) { return x.kind === 'single'; });
    var isLast = step.q[step.q.length - 1].name === target.name;
    if (allSingle && isLast && !problems(step).length) { clearTimeout(autoT); autoT = setTimeout(function () { if (STEPS[screen - 1] === step) next(); }, REDUCE ? 120 : 420); }
  }
  D.addEventListener('keydown', function (e) {
    if (e.defaultPrevented || e.altKey || e.ctrlKey || e.metaKey) return;
    var t = e.target, typing = t && (t.tagName === 'TEXTAREA' || (t.tagName === 'INPUT' && /^(text|email|tel|search)$/.test(t.type)));
    if (e.key === 'Enter' && !e.shiftKey) {
      if (t && (t.tagName === 'TEXTAREA' || t.tagName === 'BUTTON' || t.tagName === 'A')) return;
      if (screen <= TOTAL) { e.preventDefault(); next(); }
      return;
    }
    if (typing || screen < 1 || screen > TOTAL || e.key.length !== 1) return;
    var k = e.key.toUpperCase(), input = $('[data-step] input[data-key="' + k + '"]', stage);
    if (input) { e.preventDefault(); input.click(); input.focus({ preventScroll: true }); }
  });

  /* ---------------- submit (same delivery path as the main form: Sheets webhook) ---------------- */
  function send(form) {
    if (busy) return;
    var err = $('[data-submit-err]', form), btn = $('[data-submit]', form), label = $('[data-submit-label]', form), R = C.review || {};
    err.textContent = '';
    for (var i = 0; i < TOTAL; i++) if (problems(STEPS[i]).length) { go(i + 1); return; }
    var data = new FormData();
    var put = function (k, v) { data.append(k, String(v == null ? '' : v).slice(0, 600)); };
    var label_ = function (id, qi) { var step = STEPS[id], q = step.q[qi || 0]; return valueOf(step, q); };
    // Lead reference (Q = quiz): same value in the "Quiz" row and in Stripe's client_reference_id.
    ref = 'Q-' + Date.now().toString(36).toUpperCase() + '-' + Math.random().toString(36).slice(2, 6).toUpperCase();
    put('ref', ref);
    put('source', 'quiz');
    put('business', st.business.trim()); put('name', st.name.trim()); put('phone', st.phone.trim()); put('email', st.email.trim());
    put('area', st.area.trim()); put('trade', label_(0));
    put('services', serviceLabels(false).join(', '));
    put('customers', label_(3, 0)); put('proof', label_(3, 1));
    put('contact_methods', label_(4));
    put('website', label_(5, 0)); put('domain', label_(5, 1));
    put('logo', label_(6, 0)); put('photos', label_(6, 1));
    put('notes', st.notes.trim());
    put('details', (serviceLabels(false).join(', ') + ' · ' + st.area.trim()));
    var qs = new URLSearchParams(location.search);
    ['utm_source', 'utm_medium', 'utm_campaign', 'utm_content', 'utm_term', 'gclid', 'fbclid'].forEach(function (k) { if (qs.get(k)) data.append(k, qs.get(k).slice(0, 200)); });
    put('lang', Q.lang); put('page', location.href.split('#')[0].slice(0, 300)); put('submitted_at', new Date().toISOString());
    var done = function () {
      sent = true; // stops save(): contact details don't outlive the submission
      try { sessionStorage.removeItem(KEY); } catch (error) { /* ignore */ }
      track({ event: 'generate_lead', form: 'quiz', lang: Q.lang });
      go(DONE, { force: true, replace: true });
    };
    var hp = form.elements.company_website;
    if (hp && hp.value) { done(); return; } // honeypot: silently accept bots
    if (!Q.endpoint) { console.warn('[520] formEndpoint not configured — quiz answers not delivered.'); done(); return; }
    busy = true; btn.disabled = true; form.setAttribute('aria-busy', 'true'); label.textContent = R.sending || '…';
    var ctrl = 'AbortController' in W ? new AbortController() : null, timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, 15000);
    var googleScript = /script\.google(usercontent)?\.com/.test(Q.endpoint);
    fetch(Q.endpoint, { method: 'POST', body: googleScript ? new URLSearchParams(data) : data, mode: googleScript ? 'no-cors' : 'cors', headers: googleScript ? undefined : { Accept: 'application/json' }, signal: ctrl ? ctrl.signal : undefined })
      .then(function (res) { if (!googleScript && !res.ok) throw new Error('HTTP ' + res.status); busy = false; done(); })
      .catch(function (error) { console.error('[520] Failed to submit quiz', error); err.textContent = R.error || ''; })
      .then(function () { clearTimeout(timer); busy = false; if (btn.isConnected) { btn.disabled = false; form.removeAttribute('aria-busy'); label.textContent = R.cta || ''; } });
  }

  /* ---------------- boot ---------------- */
  safe('boot', function () {
    var at = restore();
    var want = fromId(location.hash.slice(1));
    var start = want || (at > 0 && at <= REVIEW ? at : 0);
    paint(false);
    SECTIONS.forEach(function (s) { if (sectionDone(s)) seen[s] = true; }); // restored answers: no replayed toasts
    go(start, { initial: true, replace: true });
  });
})();
</script>
